[build]
  command = "npm run build"
  publish = "dist"

# Los assets generados por Vite se sirven directamente
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# Todo lo demás va a index.html para que Vue Router maneje la ruta
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200